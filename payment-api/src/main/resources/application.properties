spring.application.name=payment_api

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_api_db
spring.datasource.username=postgres
spring.datasource.password=theplanetisflat

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#my login credentials
spring.security.user.name =thato
spring.security.password =password123


#JWT Configuration
jwt.secret=MyBankSuperSecretKeyThatIsAtLeast256BitsLongForSecurity
#this is the secret key used to sign token


logging.level.com.banking=DEBUG
logging.level.org.springframework.security=DEBUG



jwt.expiration=86400000
#86400000 = 24 hours
#after 24 hours the token will expire


server.port=8083

#Banking API - this will be called by payment
banking.api.url=http://localhost:8082

#customer API - this will be called by payment api
customer.api.url=http://localhost:8081



#KAFKA CONFIG
spring.kafka.bootstrap-servers=localhost:9092

# Producer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer settings
spring.kafka.consumer.group-id=payment-api-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topic names
kafka.topic.bulk.initiated=payment.bulk.initiated
kafka.topic.payment.completed=payment.completed
kafka.topic.payment.failed=payment.failed